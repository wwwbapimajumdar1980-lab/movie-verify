<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix - Watch & Download Movies</title>
    
    <!-- Monetag Verification Meta Tag -->
    <meta name="monetag" content="caf9147105b7db8763654d41971b79dd">

    <!-- Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 28px 20px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .step-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .step-item {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 10px;
        }

        .step-item:last-child {
            margin-bottom: 0;
        }

        .step-number {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .footer-note {
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🎬</div>
        <h1>CineFlix Movie Portal</h1>
        <p>সিনেমাটি পেতে নিচের ধাপটি সম্পন্ন করে টেলিগ্রাম বটের মাধ্যমে আপনার ফাইলটি সংগ্রহ করুন।</p>

        <div class="step-box">
            <div class="step-item">
                <span class="step-number">1</span>
                <span>অ্যাডভার্টাইজমেন্ট পেজটি ওপেন হবে</span>
            </div>
            <div class="step-item">
                <span class="step-number">2</span>
                <span>৩টি সহজ পেজ পার হয়ে লিংক ভেরিফাই করুন</span>
            </div>
            <div class="step-item">
                <span class="step-number">3</span>
                <span>'Continue to Bot' অপশনে ক্লিক করে সিনেমা নিন</span>
            </div>
        </div>

        <button class="btn" onclick="continueToBot()">
            <span>Continue to Bot</span> ➔
        </button>

        <div class="footer-note">
            Powered by CineFlix Telegram Bot
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        });

        function continueToBot() {
            const urlParams = new URLSearchParams(window.location.search);
            const fileId = urlParams.get('start') || 'movie_default';

            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.close) {
                window.Telegram.WebApp.close();
            } else {
                window.location.href = `https://t.me/your_bot_username?start=${fileId}`;
            }
        }
    </script>
</body>
</html>
